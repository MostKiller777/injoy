<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070b">
  <meta name="description" content="Injoy — films, series and episodes in one place.">
  <title>Injoy — watch everything</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Injoy home">
      <span class="brand-mark" aria-hidden="true">ij</span>
      <span class="brand-name">INJOY</span>
    </a>

    <nav class="primary-nav" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/films" data-nav="films">Films</a>
      <a href="#/series" data-nav="series">Series</a>
      <a href="#/genres" data-nav="genres">Genres</a>
      <a href="#/list" data-nav="list">My list</a>
    </nav>

    <div class="topbar-actions">
      <form class="search" id="search-form" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
        <input id="search-input" name="q" type="search" placeholder="Search films, actors, decades" aria-label="Search films" spellcheck="false">
      </form>

      <a class="icon-btn" href="#/admin" title="Admin — add a movie" aria-label="Admin panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M16 7h4M4 17h4M12 17h8"></path><circle cx="14" cy="7" r="2.2"></circle><circle cx="10" cy="17" r="2.2"></circle></svg>
      </a>

      <button class="icon-btn" id="random-btn" type="button" title="Surprise me (R)" aria-label="Pick a random film">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5l3 5-3 5H3"></path><path d="M21 7h-3.5l-6.2 10H8"></path><path d="m17.5 17 3.5 0"></path><path d="m17.5 7 3.5 0"></path><path d="m17.8 5 2 2-2 2"></path><path d="m17.8 15 2 2-2 2"></path></svg>
      </button>

      <a class="avatar" href="#/list" title="My list" aria-label="My list">I</a>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="hero" aria-label="Featured film" hidden></section>
    <section class="view" id="view" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark small" aria-hidden="true">ij</span>
        <span>INJOY</span>
      </div>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="player-root"></div>
  <div id="toast-root" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
