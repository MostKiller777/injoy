# Render blueprint. Point Render at this repo and pick "Blueprint"; it reads
# this file and builds the Dockerfile. Nothing else to configure.
#
# Free plan notes:
#   - no persistent disk, so DATA_DIR is the container filesystem. The
#     catalogue lives in the repo and is unaffected; watchlist, resume
#     positions and downloaded media reset when the service redeploys.
#   - a free service sleeps after 15 minutes idle and takes ~40s to wake.
#
# Want the library to persist? Change plan to `starter` and uncomment `disk`.
services:
  - type: web
    name: injoy
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT itself; the app reads it. Do not set it here.
      - key: DATA_DIR
        value: /data
      # Prompted for once when the blueprint is created, never stored in git.
      - key: ADMIN_KEY
        sync: false
      # Optional. Leave blank for the keyless curated catalogue.
      - key: TMDB_API_KEY
        sync: false
    # disk:
    #   name: injoy-data
    #   mountPath: /data
    #   sizeGB: 5
